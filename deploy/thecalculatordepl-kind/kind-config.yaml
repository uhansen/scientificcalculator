kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: __CLUSTER_NAME__
nodes:
  - role: control-plane
    image: __NODE_IMAGE__
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: __HOST_HTTP_PORT__
        protocol: TCP
      - containerPort: 443
        hostPort: __HOST_HTTPS_PORT__
        protocol: TCP
