# RuntimeClass for the containerd-shim-spin runtime.
#
# Unlike the k3d/cloud variants (which run stock nodes and install the shim
# with Runtime Class Manager), the kind node image already has
# containerd-shim-spin baked in (see KIND_NODE_IMAGE in deploy.sh), so only
# the RuntimeClass object itself needs to be created.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: wasmtime-spin-v2
handler: spin
