app:
  name: thecalculatorspin
  host: thecalculatorspin.local
  namespace: default
envoyGateway:
  className: thecalculatorspin-envoy
  gatewayName: thecalculatorspin-http
  proxy:
    name: thecalculatorspin-envoyproxy
    namespace: default
    annotations:
      kubernetes.io/elb.class: performance
      kubernetes.io/elb.http-redirect: "true"
      kubernetes.io/elb.listen-ports: '[{"HTTP": 80},{"HTTPS": 443}]'
keda:
  namespace: keda
  interceptorServiceName: keda-add-ons-http-interceptor-proxy
  interceptorServicePort: 8080
